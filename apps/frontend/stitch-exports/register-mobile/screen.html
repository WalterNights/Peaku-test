<!-- Mobile Container Wrapper -->
<div class="w-full max-w-[375px] bg-background min-h-screen shadow-lg relative overflow-hidden flex flex-col">
<!-- Top Hero Section -->
<header class="relative w-full h-[180px] shrink-0">
<img alt="" class="w-full h-full object-cover absolute inset-0" src="https://lh3.googleusercontent.com/aida/ADBb0ug8WQtpUO9gbt1P6tOrbzYZvQroug8-qOUepnozfx0r8DxoFMZhMwAgGP5ux1YO8VurZ_Qw9mz-YeMcG9aBaWt-QlBiewZOALxhsRRsd_ii_MeN6X0i6Xp1mCulNAwpHCnBpNlbL03ZQhmNpVBtVf8w0bwKhLuS5sF--kRfNX0g8H8M3OOhRg8dIzq78zPO-FAGjmygYvve93igCFn501Sjtn9h03RncD1kxrb-tTBl18hWuDPNYeS1grA"/>

<div class="absolute top-6 left-6 flex items-center">
<span class="font-display-md text-display-md text-surface-container-lowest drop-shadow-md">PeaKu</span>
</div>
</header>
<!-- Main Form Content -->
<main class="flex-1 px-6 py-6 pb-12 flex flex-col z-10 -mt-2 bg-background rounded-t-xl relative">
<div class="mb-8">
<span class="font-label-eyebrow text-label-eyebrow text-muted-foreground uppercase block mb-2">NUEVA CUENTA</span>
<h1 class="font-h2 text-h2 text-foreground mb-1">Crear cuenta</h1>
<p class="font-body-sm text-body-sm text-muted-foreground">Sumate a la red de productores agropecuarios.</p>
</div>
<form class="flex flex-col gap-4">
<!-- Nombre y Apellido -->
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-1.5">
<label class="font-body text-[15px] font-medium text-foreground" for="nombre">Nombre</label>
<input class="h-11 rounded-lg border border-border bg-transparent px-3 text-foreground focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-colors" id="nombre" placeholder="Tu nombre" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-body text-[15px] font-medium text-foreground" for="apellido">Apellido</label>
<input class="h-11 rounded-lg border border-border bg-transparent px-3 text-foreground focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-colors" id="apellido" placeholder="Tu apellido" type="text"/>
</div>
</div>
<!-- Correo -->
<div class="flex flex-col gap-1.5">
<label class="font-body text-[15px] font-medium text-foreground" for="email">Correo electrónico</label>
<input class="h-11 rounded-lg border border-border bg-transparent px-3 text-foreground focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-colors" id="email" placeholder="ejemplo@correo.com" type="email"/>
<span class="font-body-sm text-[12px] text-muted-foreground">Lo usarás para iniciar sesión.</span>
</div>
<!-- Contraseña -->
<div class="flex flex-col gap-1.5 mt-2">
<label class="font-body text-[15px] font-medium text-foreground" for="password">Contraseña</label>
<div class="relative">
<input class="w-full h-11 rounded-lg border border-border bg-transparent px-3 pr-10 text-foreground focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
<!-- Strength Indicator -->
<div class="flex items-center gap-2 mt-1">
<div class="flex-1 flex gap-1 h-1.5">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-surface-variant rounded-full"></div>
</div>
<span class="text-[11px] font-medium text-primary font-body">Buena</span>
</div>
</div>
<!-- Confirmar Contraseña -->
<div class="flex flex-col gap-1.5 mt-2">
<label class="font-body text-[15px] font-medium text-foreground" for="confirm-password">Confirmar contraseña</label>
<div class="relative">
<input class="w-full h-11 rounded-lg border border-border bg-transparent px-3 pr-10 text-foreground focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-colors" id="confirm-password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
<span class="font-body-sm text-[12px] text-muted-foreground">Repetí tu contraseña.</span>
</div>
<!-- Terms -->
<div class="flex items-start gap-3 mt-4">
<input class="mt-1 h-4 w-4 rounded border-border text-primary focus:ring-accent bg-transparent" id="terms" type="checkbox"/>
<label class="font-body-sm text-[13px] text-muted-foreground leading-snug" for="terms">
                        Acepto los <a class="text-accent hover:underline" href="#">Términos y condiciones</a> y la <a class="text-accent hover:underline" href="#">Política de privacidad</a>.
                    </label>
</div>
<!-- Main CTA -->
<button class="w-full h-[48px] bg-primary text-on-primary font-body font-semibold rounded-lg mt-6 hover:bg-surface-tint transition-colors" type="button">
                    Crear cuenta
                </button>
<!-- Divider -->
<div class="flex items-center gap-4 my-4">
<div class="flex-1 h-px bg-border"></div>
<span class="font-body-sm text-[13px] text-muted-foreground">o</span>
<div class="flex-1 h-px bg-border"></div>
</div>
<!-- Secondary Auth -->
<button class="w-full h-[48px] border border-border text-foreground font-body font-medium rounded-lg flex items-center justify-center gap-2 opacity-50 cursor-not-allowed" type="button">
<svg fill="none" height="18" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continuar con Google
                </button>
</form>
<div class="mt-8 text-center">
<p class="font-body-sm text-[14px] text-muted-foreground">
                    ¿Ya tenés cuenta? <a class="text-accent font-medium hover:underline" href="#">Iniciar sesión</a>
</p>
</div>
<div class="mt-auto pt-8 text-center">
<span class="font-body-sm text-[12px] text-muted-foreground">© 2026 PeaKu</span>
</div>

</div>
