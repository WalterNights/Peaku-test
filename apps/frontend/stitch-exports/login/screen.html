<div class="space-y-1.5">

                            Correo electrónico
                        </label>
<input class="w-full h-10 px-3 py-2 rounded font-body-sm text-body-sm border border-border bg-card text-foreground placeholder:text-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent transition-colors" id="email" placeholder="vos@empresa.com" type="email"/>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="font-body-sm text-body-sm font-medium text-foreground block" for="password">
                                Contraseña
                            </label>
<a class="font-body-sm text-body-sm text-accent hover:text-accent/80 hover:underline underline-offset-4 transition-colors" href="#">
                                ¿Olvidaste tu contraseña?
                            </a>
</div>
<div class="relative">
<input class="w-full h-10 px-3 py-2 rounded font-body-sm text-body-sm border border-border bg-card text-foreground placeholder:text-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent transition-colors pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors focus:outline-none" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full h-12 rounded-lg bg-primary-container text-on-primary font-body text-body font-semibold hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background transition-all" type="submit">
                        Iniciar sesión
                    </button>
</form>

<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-border"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-muted-foreground">o</span>
<div class="flex-grow border-t border-border"></div>
